<text x="568" y="313" font-size="22" font-weight="bold" fill="#7c9077" font-family="Arial">ОБЛАСТЬ</text>
<text x="568" y="356" fill="#35473c" font-family="Arial, sans-serif" font-size="29">ЩЁКИ</text>
<path d="M563 401H789" stroke="#d6dbce" stroke-width="2"/>
<text x="568" y="442" font-size="22" font-weight="bold" fill="#7c9077" font-family="Arial">ГЛАВНОЕ</text>
<text x="568" y="486" fill="#35473c" font-family="Arial, sans-serif" font-size="22">Выполняй медленные</text><text x="568" y="517" fill="#35473c" font-family="Arial, sans-serif" font-size="22">небольшие круговые</text><text x="568" y="548" fill="#35473c" font-family="Arial, sans-serif" font-size="22">движения вверх по</text><text x="568" y="579" fill="#35473c" font-family="Arial, sans-serif" font-size="22">щекам.</text>
<text x="58" y="929" font-size="31" font-weight="bold" fill="#35473c" font-family="Arial">КАК ВЫПОЛНЯТЬ</text>
<rect x="48" y="955" width="804" height="352" rx="29" fill="#e6e9dc"/>
<circle cx="92" cy="1010" r="21" fill="#70866e"/><text x="92" y="1018" text-anchor="middle" font-size="23" fill="white" font-family="Arial">1</text><text x="132" y="1002" fill="#35473c" font-family="Arial, sans-serif" font-size="22">Сядь удобно и расслабь челюсть.</text><circle cx="92" cy="1087" r="21" fill="#70866e"/><text x="92" y="1095" text-anchor="middle" font-size="23" fill="white" font-family="Arial">2</text><text x="132" y="1079" fill="#35473c" font-family="Arial, sans-serif" font-size="22">Помести подушечки пальцев на мясистую часть щёк, не на</text><text x="132" y="1108" fill="#35473c" font-family="Arial, sans-serif" font-size="22">область глаз.</text><circle cx="92" cy="1164" r="21" fill="#70866e"/><text x="92" y="1172" text-anchor="middle" font-size="23" fill="white" font-family="Arial">3</text><text x="132" y="1156" fill="#35473c" font-family="Arial, sans-serif" font-size="22">Выполняй медленные небольшие круговые движения вверх</text><text x="132" y="1185" fill="#35473c" font-family="Arial, sans-serif" font-size="22">по щекам.</text><circle cx="92" cy="1241" r="21" fill="#70866e"/><text x="92" y="1249" text-anchor="middle" font-size="23" fill="white" font-family="Arial">4</text><text x="132" y="1233" fill="#35473c" font-family="Arial, sans-serif" font-size="22">Постепенно перемещайся от области возле носа к боковым</text><text x="132" y="1262" fill="#35473c" font-family="Arial, sans-serif" font-size="22">частям лица, не растягивая кожу.</text>
<rect x="48" y="1330" width="386" height="211" rx="28" fill="#edf0e6"/>
<rect x="454" y="1330" width="398" height="211" rx="28" fill="#f3ded9"/>
<text x="74" y="1380" font-size="25" font-weight="bold" font-family="Arial" fill="#455d49">✓ ПОДСКАЗКА</text>
<text x="74" y="1431" fill="#35473c" font-family="Arial, sans-serif" font-size="24">Маленькие мягкие круги</text>
<text x="480" y="1380" font-size="25" font-weight="bold" font-family="Arial" fill="#a54f4b">! БЕЗОПАСНОСТЬ</text>
<text x="480" y="1425" fill="#35473c" font-family="Arial, sans-serif" font-size="21">Не массируй воспалённую или</text><text x="480" y="1455" fill="#35473c" font-family="Arial, sans-serif" font-size="21">повреждённую кожу.</text>
<text x="58" y="1576" font-size="18" letter-spacing="2" fill="#70826e" font-family="Arial">40 СЕКУНД   •   БЕЗ БОЛИ   •   ДЫШИ РОВНО</text>
